<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Avalie o atendimento da Auto Escola Condutor no Google." />
    <title>Auto Escola Condutor — Avaliações</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231a73e8'/%3E%3Cpath d='M15 42h34M20 34h24M24 26h16' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='48' r='4' fill='%23f4e500'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="color-dots" aria-hidden="true">
        <span class="dot blue"></span><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      </div>

      <section class="review-card" aria-labelledby="page-title">
        <div class="brand-lockup">
          <img class="brand-logo" src="./assets/Logo_Condutor_sem_fundo.webp" alt="Logo Auto Escola Condutor" />
        </div>

        <div class="yellow-rule" aria-hidden="true"></div>

        <p class="eyebrow">Auto Escola Condutor</p>
        <h1 id="page-title">Você gostou do nosso atendimento?</h1>
        <p class="supporting-copy">Sua opinião ajuda outras pessoas a escolherem uma autoescola de confiança.</p>

        <div class="stars" aria-label="Cinco estrelas de avaliação">
          <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
        </div>

        <a class="review-button" href="https://search.google.com/local/writereview?placeid=ChIJnSWxMhN_vZQRJkcodq7XDts" target="_blank" rel="noopener noreferrer">
          <span class="google-g" aria-hidden="true">G</span>
          <span>Avaliar no Google</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <p class="fine-print">Leva menos de um minuto. Obrigado por confiar na Condutor.</p>
      </section>

      <footer class="site-footer">
        <span class="footer-mark" aria-hidden="true">●</span>
        <span>Obrigado pela sua preferência</span>
      </footer>
    </main>
  </body>
</html>
